[project]
name = "marketing-pipeline"
version = "0.1.0"
description = "Meta Ads + GA4 ingestion and attribution pipeline on BigQuery"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "google-cloud-bigquery>=3.17",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "responses>=0.24", "ruff>=0.3"]
airflow = ["apache-airflow>=2.8", "apache-airflow-providers-google>=10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
