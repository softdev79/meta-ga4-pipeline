# Deploys the Ajay Pharma website to GitHub Pages (free hosting).
#
# No manual setup needed: actions/configure-pages below turns Pages on via the
# API (enablement: true) the first time this runs, using the workflow's own
# `pages: write` permission. Every later push republishes the site.
name: Deploy website

on:
  push:
    branches:
      - main
      - claude/ajay-pharma-website-5pul5d
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Turns Pages on if it has never been enabled, and reports the base URL.
      - name: Enable GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validate the medicine database
        working-directory: website
        run: node test/validate.js

      - name: Build the site
        working-directory: website
        run: node build.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
