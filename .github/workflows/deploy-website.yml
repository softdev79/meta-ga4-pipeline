# Deploys the Ajay Pharma website to GitHub Pages (free hosting).
#
# One-time setup by the repository owner:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# After that, every push to this branch republishes the site at:
#   https://softdev79.github.io/meta-ga4-pipeline/
name: Deploy website

on:
  push:
    branches:
      - main
      - claude/ajay-pharma-website-5pul5d
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate the medicine database
        working-directory: website
        run: node test/validate.js

      - name: Build the site
        working-directory: website
        run: node build.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
