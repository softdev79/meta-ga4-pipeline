# Deploys the Ajay Pharma website to GitHub Pages (free hosting).
#
# ONE-TIME SETUP by the repository owner, then this runs on every push:
#
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
# This cannot be automated. `pages: write` lets the workflow token DEPLOY to a
# Pages site, but creating one needs admin rights the token does not have —
# actions/configure-pages with enablement:true returns "Resource not accessible
# by integration". Verified on run 35425134690.
#
# Pages deploys from the DEFAULT branch, so merge this branch into main first
# (or add it under Settings -> Environments -> github-pages -> deployment
# branches). Site URL: https://softdev79.github.io/meta-ga4-pipeline/
name: Deploy website

on:
  push:
    branches:
      - main
      - claude/ajay-pharma-website-5pul5d
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Resolves the site's base URL. Does not enable Pages — see the note above.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Validate the medicine database
        working-directory: website
        run: node test/validate.js

      - name: Build the site
        working-directory: website
        run: node build.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
